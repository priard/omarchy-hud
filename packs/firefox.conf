# Firefox and its forks. Their menubar is not exported over D-Bus.
# Chords from browser-sets.inc and, for Zen, ZenKeyboardShortcuts.mjs.
[firefox zen librewolf floorp waterfox]
New tab = Ctrl+T
New window = Ctrl+N
New private window = Ctrl+Shift+P
Close tab = Ctrl+W
Close window = Ctrl+Shift+W
Reopen closed tab = Ctrl+Shift+T
Next tab = Ctrl+Tab
Previous tab = Ctrl+Shift+Tab
Mute tab = Ctrl+M
Focus address bar = Ctrl+L
Reload = Ctrl+R
Reload ignoring cache = Ctrl+Shift+R
Find in page = Ctrl+F
Print = Ctrl+P
Bookmark this page = Ctrl+D
Bookmarks sidebar = Ctrl+B
Show all bookmarks = Ctrl+Shift+O
History sidebar = Ctrl+H
Show all history = Ctrl+Shift+H
Clear recent history = Ctrl+Shift+Delete
Downloads = Ctrl+Shift+Y
Add-ons and themes = Ctrl+Shift+A
Screenshot = Ctrl+Shift+S
Picture-in-picture = Ctrl+Shift+bracketright
Reader view = Ctrl+Alt+R
Zoom in = Ctrl+equal
Zoom out = Ctrl+minus
Reset zoom = Ctrl+0
Full screen = F11
Page source = Ctrl+U
Page info = Ctrl+I
Developer tools = Ctrl+Shift+I
Process manager = Shift+Escape
Quit = Ctrl+Q

# Zen takes over Ctrl+S and Ctrl+Shift+K, so these stay with the others.
[firefox librewolf floorp waterfox]
Save page as = Ctrl+S
Web console = Ctrl+Shift+K

[zen]
Toggle compact mode = Ctrl+S
Show sidebar = Ctrl+Alt+S
Copy page address = Ctrl+Shift+C
Pin or unpin tab = Ctrl+Shift+D
Close all unpinned tabs = Ctrl+Shift+K
Next workspace = Ctrl+Alt+Right
Previous workspace = Ctrl+Alt+Left
Split view grid = Ctrl+Alt+G
Split view vertical = Ctrl+Alt+V
Split view horizontal = Ctrl+Alt+H
Unsplit view = Ctrl+Alt+U
Glance expand = Ctrl+O
Library = Alt+Shift+L
