# Chromium-based browsers. They export no menu over D-Bus.
[chromium google-chrome brave-browser vivaldi-stable]
New tab = Ctrl+T
New window = Ctrl+N
New incognito window = Ctrl+Shift+N
Close tab = Ctrl+W
Close window = Ctrl+Shift+W
Reopen closed tab = Ctrl+Shift+T
Next tab = Ctrl+Tab
Previous tab = Ctrl+Shift+Tab
Focus address bar = Ctrl+L
Reload = Ctrl+R
Reload ignoring cache = Ctrl+Shift+R
Find in page = Ctrl+F
Save page as = Ctrl+S
Print = Ctrl+P
Bookmark this page = Ctrl+D
Show bookmarks bar = Ctrl+Shift+B
Bookmark manager = Ctrl+Shift+O
History = Ctrl+H
Downloads = Ctrl+J
Clear browsing data = Ctrl+Shift+Delete
Zoom in = Ctrl+equal
Zoom out = Ctrl+minus
Reset zoom = Ctrl+0
Full screen = F11
Page source = Ctrl+U
Developer tools = Ctrl+Shift+I
Task manager = Shift+Escape
Quit = Ctrl+Shift+Q
