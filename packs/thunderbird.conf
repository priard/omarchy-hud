# Thunderbird. Its menubar is not exported over D-Bus. Chords from its messenger.xhtml.
[org.mozilla.Thunderbird thunderbird betterbird]
Get new messages = F5
Get all new messages = Shift+F5
Write new message = Ctrl+N
Reply = Ctrl+R
Reply all = Ctrl+Shift+R
Reply to list = Ctrl+Shift+L
Forward = Ctrl+L
Archive = A
Delete message = Delete
Toggle read = M
Mark all as read = Shift+C
Toggle star = S
Mark as junk = J
Mark as not junk = Shift+J
Next unread message = N
Previous unread message = P
Reopen closed tab = Ctrl+Shift+T
Quick filter = Ctrl+Shift+K
Search all messages = Ctrl+K
Find in message = Ctrl+F
Toggle message pane = F8
Address book = Ctrl+Shift+B
Print = Ctrl+P
Message source = Ctrl+U
Zoom in = Ctrl+equal
Zoom out = Ctrl+minus
Reset zoom = Ctrl+0
Quit = Ctrl+Q
