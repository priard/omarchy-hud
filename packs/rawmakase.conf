# RAWmakase, a Lightroom-compatible RAW editor (egui, no menubar).
# Chords from its src/app/shortcuts.rs; Cmd is Ctrl and Option is Alt on Linux.
[RAWmakase]
Library = G
Develop = D
Open the Loupe = E
Compare with the next photo = C
Survey the selected photos = N
Keyboard shortcuts = Ctrl+slash
Preferences = Ctrl+comma
Hide or show the side panels = Tab
Hide or show the side panels and filmstrip = Shift+Tab
Left panel = F7
Right panel = F8
Filmstrip = F6
Undo = Ctrl+Z
Redo = Ctrl+Shift+Z
Create virtual copy = Ctrl+apostrophe

Library › Select all = Ctrl+A
Library › Select none = Ctrl+D
Library › Turn the filters off or on = Ctrl+L
Library › Cycle the grid cell style = J
Library › Rename = F2
Library › Remove from the catalog = Alt+Delete
Library › Delete the rejected photos = Ctrl+Delete
Library › Sync settings to the selection = Ctrl+Shift+S

Loupe › Zoom in = Ctrl+equal
Loupe › Zoom out = Ctrl+minus
Loupe › Zoom to 100% = Ctrl+Alt+0
Loupe › Fit or last zoom = Z
Loupe › Cycle photo info = I

Rating › No stars = 0
Rating › 1 star = 1
Rating › 2 stars = 2
Rating › 3 stars = 3
Rating › 4 stars = 4
Rating › 5 stars = 5
Rating › Lower the rating = bracketleft
Rating › Raise the rating = bracketright
Label › Red = 6
Label › Yellow = 7
Label › Green = 8
Label › Blue = 9
Flag › Pick = P
Flag › Reject = X
Flag › Unflag = U
Flag › Toggle pick = grave
Quick Collection › Add or take out = B
Quick Collection › Show = Ctrl+B
Quick Collection › Clear = Ctrl+Shift+B

Develop › Crop and straighten = R
Develop › Guided Upright = Shift+T
Develop › Spot removal = Q
Develop › Masking = Shift+W
Develop › White balance selector = W
Develop › Targeted adjustment: Tone Curve = Ctrl+Alt+Shift+T
Develop › Targeted adjustment: Hue = Ctrl+Alt+Shift+H
Develop › Targeted adjustment: Saturation = Ctrl+Alt+Shift+S
Develop › Targeted adjustment: Luminance = Ctrl+Alt+Shift+L
Develop › Targeted adjustment: B&W mix = Ctrl+Alt+Shift+G
Develop › Before alone = backslash
Develop › Before and after, left and right = Y
Develop › Before and after, top and bottom = Alt+Y
Develop › Before and after, split = Shift+Y
Develop › Swap Before and After = Ctrl+Alt+Shift+Up
Develop › Reference View = Shift+R
Develop › Show clipping = J
Develop › Copy settings = Ctrl+Shift+C
Develop › Paste settings = Ctrl+Shift+V
Develop › Paste settings from previous photo = Ctrl+Alt+V
Develop › Match total exposures = Ctrl+Alt+Shift+M
Develop › New Develop Preset = Ctrl+Shift+N
Develop › Reset all settings = Ctrl+Shift+R
Develop › Auto tone = Ctrl+Shift+U
Develop › Black & white or color = V
Develop › Export = Ctrl+Shift+E
Develop › Export with previous = Ctrl+Alt+Shift+E
