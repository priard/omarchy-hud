# Flea, Omarchy's file manager (default key preset). It has no menubar.
[com.thisisgm.flea]
New window = Ctrl+N
New folder = Ctrl+Shift+N
Close tab = Ctrl+W
Next tab = Ctrl+Page_Down
Previous tab = Ctrl+Page_Up
Edit path = Ctrl+L
Search = Ctrl+F
Toggle sidebar = Ctrl+B
Toggle preview = Alt+P
Toggle hidden files = Ctrl+period
Open terminal here = Ctrl+T
Reload = Ctrl+R
List view = Ctrl+1
Column view = Ctrl+2
Grid view = Ctrl+3
Dual pane = Ctrl+4
Larger text = Ctrl+equal
Smaller text = Ctrl+minus
Reset text size = Ctrl+0
Copy path = Ctrl+Shift+C
Select all = Ctrl+A
Undo = Ctrl+Z
Redo = Ctrl+Shift+Z
Settings = Ctrl+comma
